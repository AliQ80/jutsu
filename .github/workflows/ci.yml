name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-installer:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Test installer with fixture releases
        shell: ${{ matrix.shell }}
        run: ./tools/test-windows-installer.ps1
      - name: Smoke-test published release and reinstall
        shell: ${{ matrix.shell }}
        run: |
          $savedPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $destination = Join-Path $env:RUNNER_TEMP 'jutsu smoke test'
          try {
            & ./install.ps1 -InstallDir $destination
            $first = (Get-FileHash (Join-Path $destination 'jutsu.exe')).Hash
            & ./install.ps1 -InstallDir $destination
            if ((Get-FileHash (Join-Path $destination 'jutsu.exe')).Hash -ne $first) {
              throw 'Reinstallation produced a different executable.'
            }
          } finally {
            [Environment]::SetEnvironmentVariable('Path', $savedPath, 'User')
            if (Test-Path $destination) { Remove-Item $destination -Recurse -Force }
          }

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - run: go vet ./...

      - run: go test ./...

      # Cross-compile every target goreleaser ships. Local builds only ever
      # target the host, so the platform-forked files (pty_exec.go vs.
      # pty_exec_windows.go) are otherwise never compiled until release time.
      - name: cross-compile release targets
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            echo "==> $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done
